  detail: >-
    HiTHIUM sells battery cells and containerised storage systems, not software: there is no
    developer surface anywhere on its estate - eleven candidate API/docs subdomains of hithium.com
    fail to resolve, every /.well-known/* path 404s on all three live hosts, the HeroEE brand site
    answers 200 with the same Next.js HTML shell for /openapi.json and /llms.txt (a soft-200, not a
    document), there is no GitHub organisation, and the only integration documentation that exists
    - the Modbus/CAN datasheets and manuals - sits behind the download centre's
    "Please login to download this datasheet" account gate.
