aid: hithium
name: Hithium
description: >-
  HiTHIUM (Xiamen Hithium Energy Storage Technology Co., Ltd.) is a Chinese energy storage
  company founded in 2019 that designs and manufactures lithium iron phosphate (LFP) cells,
  modules and complete battery energy storage systems (BESS) for utility-scale, commercial and
  industrial, and residential applications. The product line runs from large-format prismatic
  ESS cells through liquid-cooled multi-megawatt-hour container systems to the HeroEE
  residential and portable range marketed at hero-ee.com. Company material reports roughly
  8,000 staff, more than 1,100 R&D engineers and over 3,900 patents. Product pages publish
  named certifications including UL 1973, UL 9540, UL 9540A, NFPA 855, IEC 62619, IEC 62477,
  IEC 63056, IEC 61000 and UN 38.3. HiTHIUM operates a Product Security Incident Response Team
  (PSIRT) running an IEC 62443-aligned vulnerability management process, and publishes numbered
  cybersecurity bulletins with CVE references and remediation guidance at
  hithium.com/support/security.html. HiTHIUM publishes no developer portal, no API reference,
  no OpenAPI, AsyncAPI, GraphQL or Postman contract, no SDKs, no CLI, no webhook catalog and no
  MCP or A2A agent surface; third-party integration happens over Modbus/CAN interfaces
  described in datasheets and manuals that sit behind the download-center account gate, and the
  HeroEE consumer app's backend is undocumented.
