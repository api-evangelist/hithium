x-tier-reason: >-
  Enriched 2026-08-22 with full STEP 0b contract discovery. www.hithium.com and en.hithium.com
  404 on /openapi.json, /swagger.json, /llms.txt and every /.well-known/* path; api., developer.,
  dev., docs., cloud., open., openapi., iot., ems., portal. and app..hithium.com do not resolve;
  hero-ee.com is a Next.js locale catch-all that answers 200 with the same 504KB HTML shell for
  /openapi.json and /llms.txt (soft-200, not a document); there is no GitHub organization and the
  github.com/hithium user account holds zero repositories. The only machine-adjacent surface found
  is the site's own internal CMS AJAX (www.hithium.com/ajax/seculist), which is not a published API.
